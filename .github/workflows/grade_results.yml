name: Grade results

on:
  schedule:
    # Once daily at 12:00 IST (GitHub Actions cron is always UTC - this is
    # 06:30 UTC), well after any reasonable match day is over. Separate
    # from the live poller so grading never competes with RapidAPI's scarce
    # 100/month budget for lineup/odds fetches — grading shares the same
    # budget file but only spends on score lookups and closing odds.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: grade-results
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Grade past predictions against real results (goals only, v1)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m footymodel.live.grade_results

      - name: Settle € paper bankroll (goals legs)
        run: PYTHONPATH=. python scripts/settle_paper_props.py

      - name: Commit + push any newly graded results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/processed/graded_results.csv \
                   data/processed/paper_props_bankroll.json \
                   data/processed/paper_bankroll_bets.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "grade results: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
