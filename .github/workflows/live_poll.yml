name: Live poll

on:
  schedule:
    # Keep 20-minute ticks (not 30): confirmed lineups only exist in a
    # ~20-40min pre-kickoff window, and GitHub Actions already delays
    # scheduled triggers by hours under load. A slower cron would miss more
    # of that window. Idle ticks are cheap now — the gate step below skips
    # Playwright + lineup/odds fetches when the saved calendar says nothing
    # is inside the live window (see footymodel/live/calendar.py).
    # 09:00-21:59 UTC covers PL kickoffs with margin on both ends.
    - cron: "*/20 9-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Refresh calendar if stale and decide whether live engines are needed
        id: gate
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m footymodel.live.calendar --gate

      - name: Cache Playwright browsers
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright chromium (for the SofaScore engine)
        if: steps.gate.outputs.should_run == 'true'
        run: playwright install --with-deps chromium

      - name: Run live poller (goals + player-prop engines, paper-trade only)
        if: steps.gate.outputs.should_run == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m footymodel.live.run_all

      - name: Run SofaScore goals engine (API-Football fallback, paper-trade only)
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true  # newer/less-proven than the API-Football path - a crash
                                 # here shouldn't block committing whatever else succeeded
        run: python -m footymodel.live.sofascore_engine

      - name: Run RapidAPI goals engine (budget-limited, heuristic-confirmed lineups)
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true  # 100 req/month hard cap - self-throttles via its own
                                 # budget file, but never let it block the commit step
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m footymodel.live.rapidapi_engine

      - name: Commit + push any new recommendations/state
        env:
          NOTIFY_URL: https://footymodel.vercel.app/api/notify
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/processed/live_seen_fixtures.json \
                   data/processed/live_recommendations.csv \
                   data/processed/live_player_props.csv \
                   data/processed/match_detail.jsonl \
                   data/processed/upcoming_fixtures.json \
                   data/processed/upcoming_watchlist.json \
                   data/processed/fixture_calendar.json \
                   data/processed/sofascore_seen_fixtures.json \
                   data/processed/rapidapi_seen_fixtures.json \
                   data/processed/rapidapi_budget.json \
                   data/processed/rapidapi_fixtures_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          python scripts/notify_dashboard.py || true  # never block the commit on a notify failure
          git commit -m "live poll: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
