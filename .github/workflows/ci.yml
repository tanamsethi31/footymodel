name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile-check every module (catches syntax/import errors)
        run: python -m compileall -q footymodel scripts
      - name: Asian Handicap settlement logic (pure, data-free)
        run: python scripts/ah_settlement_test.py
      - name: Goals engine Over/Under odds parser (pure, data-free)
        run: python scripts/goals_odds_parse_test.py
      - name: Live player-prop odds parser (pure, data-free)
        run: python scripts/props_odds_parse_test.py
      - name: SofaScore odds parser (pure, data-free)
        run: python scripts/sofascore_odds_parse_test.py
      - name: RapidAPI odds parser (pure, data-free)
        run: python scripts/rapidapi_odds_parse_test.py
      - name: Grade-results mixed-format kickoff parsing (pure, data-free)
        run: python scripts/grade_results_datetime_test.py
      - name: Grade-results ragged-column parsing (pure, data-free)
        run: python scripts/grade_results_columns_test.py
      - name: Grade-results by-id lookup + fallback (pure, data-free)
        run: python scripts/grade_results_by_id_test.py
      - name: Match-detail JSONL logging (pure, data-free)
        run: python scripts/match_detail_test.py
      - name: Kelly bankroll simulator (pure, data-free)
        run: python scripts/kelly_simulation_test.py
      - name: Player-roster incremental merge logic (pure, data-free)
        run: python scripts/build_players_merge_test.py
      - name: Upcoming-fixture preview list building (pure, data-free)
        run: python scripts/run_all_upcoming_test.py
      - name: run_all.py shared-fetch orchestration + fixture-window regression (mocked API)
        run: python scripts/run_all_dryrun.py
      - name: Missed-fixture backfill script recovery + idempotency (mocked API)
        run: python scripts/backfill_missed_fixtures_test.py
